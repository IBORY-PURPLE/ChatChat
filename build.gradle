plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'chating app'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def frontendDir = "$projectDir/frontend"

sourceSets {
    main {
        resources { srcDirs = ["$projectDir/src/main/resources"] }
    }
}


tasks.register("npmInstall", Exec) {
    workingDir = file(frontendDir)
    group = BasePlugin.BUILD_GROUP

    if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")) {
        commandLine "npm.cmd", "install"
    } else {
        commandLine "npm", "install"
    }
}

tasks.register("buildReact", Exec) {
    dependsOn "npmInstall"
    workingDir = file(frontendDir)
    group = BasePlugin.BUILD_GROUP

    if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")) {
        commandLine "npm.cmd", "run", "build"   // vite build
    } else {
        commandLine "npm", "run", "build"
    }
}

tasks.register("copyReactBuildFiles", Copy) {
    dependsOn "buildReact"
    from "$frontendDir/dist"                     // ★ Vite 결과물 폴더
    into "$projectDir/src/main/resources/static" // Spring 정적 리소스 위치
}

processResources {
    dependsOn "copyReactBuildFiles"
}